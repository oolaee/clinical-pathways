[package]
name = "clinical-pathways"
version = "1.4.2"
description = "Olympia Clinical Pathways — clinical decision support desktop app"
authors = ["Olympia Aesthetics & Wellness"]
edition = "2021"
rust-version = "1.77.2"

# The library the binary links against — Tauri's mobile targets expect this shape.
[lib]
name = "clinical_pathways_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"

[features]
# Used by `tauri dev`/`build` to keep the webview devtools available in debug.
custom-protocol = ["tauri/custom-protocol"]
